<header class="nav">
  <div class="contenedor nav-fila">
    <a class="marca" routerLink="/" (click)="menuAbierto.set(false)">
      <span class="marca-placa">MC</span>
      Mi Cacharrito
    </a>

    <button type="button" class="nav-toggle" aria-controls="menu-principal" aria-label="Abrir menú"
            [attr.aria-expanded]="menuAbierto()" (click)="menuAbierto.set(!menuAbierto())">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <nav id="menu-principal" class="nav-menu" [class.abierto]="menuAbierto()" aria-label="Principal">
      @if (usuario()) {
        <a routerLink="/vehiculos" routerLinkActive="activo" (click)="menuAbierto.set(false)">Vehículos</a>
        <a routerLink="/mis-alquileres" routerLinkActive="activo" (click)="menuAbierto.set(false)">Mis alquileres</a>
      }
      @if (administrador()) {
        <a routerLink="/admin" routerLinkActive="activo" (click)="menuAbierto.set(false)">Panel de administración</a>
      }
      @if (!usuario() && !administrador()) {
        <a routerLink="/login" routerLinkActive="activo" (click)="menuAbierto.set(false)">Ingresar</a>
        <a class="btn btn-acento btn-sm" routerLink="/registro" (click)="menuAbierto.set(false)">Crear cuenta</a>
      }
      @if (usuario() || administrador()) {
        <span class="nav-persona"><span class="avatar" aria-hidden="true">{{ iniciales() }}</span>{{ nombre() }}</span>
        <button type="button" class="nav-salir" (click)="cerrarSesion()">Cerrar sesión</button>
      }
    </nav>
  </div>
</header>
